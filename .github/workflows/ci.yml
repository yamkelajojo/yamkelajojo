name: Portfolio CI & Quality Gates

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Unit, Integration, Worker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SvelteKit sync & TypeScript check
        run: npm run check

      - name: Run ESLint
        run: npm run lint

      - name: Run unit and integration suites with coverage
        run: npm run test:coverage

      - name: Build the Cloudflare Worker and Static Assets
        run: npm run build

      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser tests against the built Cloudflare Worker
        run: npm run test:e2e
