name: Portfolio CI & Quality Gates

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run SvelteKit sync & TypeScript check
        run: npm run check

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit, White-Box, Integration & Accessibility Tests with Coverage
        run: npm run test:coverage

      - name: Build Cloudflare Worker production bundle
        run: npm run build
