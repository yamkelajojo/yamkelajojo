<!doctype html>
<html lang="en" class="theme-light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f7f4ee" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('yj-theme');
					var prefersDark =
						window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme = stored === 'dark' || stored === 'light' ? stored : prefersDark ? 'dark' : 'light';
					document.documentElement.classList.remove('theme-light', 'theme-dark');
					document.documentElement.classList.add('theme-' + theme);
					document.documentElement.setAttribute('data-theme', theme);
					var themeColor = document.querySelector('meta[name="theme-color"]');
					if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0f1110' : '#f7f4ee');
				} catch (_e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="sveltekit-root">%sveltekit.body%</div>
	</body>
</html>
