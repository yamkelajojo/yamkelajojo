<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 345" width="960" height="345" role="img" aria-labelledby="arch-p-title arch-p-desc">
  <title id="arch-p-title">Cloudflare Workers Caching and GitHub response flow</title>
  <desc id="arch-p-desc">A Workers Caching hit returns a stored SvelteKit response without running the Worker, but still counts as a Worker request. A cold miss or cache revalidation invokes the SvelteKit Worker, which fetches and normalizes GitHub data before returning a cacheable HTML or JSON response. A maintained snapshot is used if GitHub fails on a cold miss.</desc>
  <rect width="960" height="320" rx="8" fill="#fbf9f5" stroke="#dcd5c7"/>
  <text x="32" y="40" font-family="monospace" font-size="13" font-weight="700" fill="#a83e1d">REQUEST PATH // WORKERS CACHING + SVELTEKIT + GITHUB REST API</text>
  <g font-family="monospace" font-size="11" fill="#161615">
    <rect x="32" y="78" width="130" height="96" rx="6" fill="#ffffff" stroke="#b4ab9b"/>
    <text x="97" y="111" text-anchor="middle" font-weight="700">Visitor</text>
    <text x="97" y="132" text-anchor="middle" fill="#625e57">GET /work</text>
    <text x="97" y="150" text-anchor="middle" fill="#625e57">or /github</text>

    <text x="174" y="130" text-anchor="middle" fill="#a83e1d" font-size="16" font-weight="700">→</text>

    <rect x="186" y="78" width="130" height="96" rx="6" fill="#dff0e8" stroke="#a8d8c2"/>
    <text x="251" y="105" text-anchor="middle" font-weight="700" fill="#114b36">Workers Caching</text>
    <text x="251" y="128" text-anchor="middle" fill="#114b36">HIT: return body</text>
    <text x="251" y="147" text-anchor="middle" fill="#114b36">MISS / revalidate: run</text>
    <text x="251" y="163" text-anchor="middle" fill="#114b36">Worker</text>

    <text x="328" y="130" text-anchor="middle" fill="#a83e1d" font-size="16" font-weight="700">→</text>

    <rect x="340" y="78" width="130" height="96" rx="6" fill="#ffffff" stroke="#b4ab9b"/>
    <text x="405" y="111" text-anchor="middle" font-weight="700">SvelteKit Worker</text>
    <text x="405" y="132" text-anchor="middle" fill="#625e57">adapter Cache API</text>
    <text x="405" y="150" text-anchor="middle" fill="#625e57">then SSR / API</text>

    <text x="482" y="130" text-anchor="middle" fill="#a83e1d" font-size="16" font-weight="700">→</text>

    <rect x="494" y="78" width="130" height="96" rx="6" fill="#ffffff" stroke="#b4ab9b"/>
    <text x="559" y="111" text-anchor="middle" font-weight="700">GitHub REST API</text>
    <text x="559" y="132" text-anchor="middle" fill="#625e57">timeout +</text>
    <text x="559" y="150" text-anchor="middle" fill="#625e57">bounded pages</text>

    <text x="636" y="130" text-anchor="middle" fill="#a83e1d" font-size="16" font-weight="700">→</text>

    <rect x="648" y="78" width="130" height="96" rx="6" fill="#f6ead4" stroke="#dfc392"/>
    <text x="713" y="111" text-anchor="middle" font-weight="700" fill="#654108">Normalize</text>
    <text x="713" y="132" text-anchor="middle" fill="#654108">or maintained</text>
    <text x="713" y="150" text-anchor="middle" fill="#654108">snapshot</text>

    <text x="790" y="130" text-anchor="middle" fill="#a83e1d" font-size="16" font-weight="700">→</text>

    <rect x="802" y="78" width="126" height="96" rx="6" fill="#161615"/>
    <text x="865" y="111" text-anchor="middle" font-weight="700" fill="#f7f4ee">HTML / JSON</text>
    <text x="865" y="132" text-anchor="middle" fill="#c7c2b9">Cache-Control</text>
    <text x="865" y="150" text-anchor="middle" fill="#c7c2b9">response</text>
  </g>
  <rect x="32" y="193" width="896" height="132" rx="6" fill="#efeae0" stroke="#dcd5c7"/>
  <text x="52" y="224" font-family="monospace" font-size="11" font-weight="700" fill="#a83e1d">RESPONSE POLICY</text>
  <text x="52" y="246" font-family="monospace" font-size="11" fill="#43413c">Success: max-age=1800, stale-while-revalidate=1800, stale-if-error=86400.</text>
  <text x="52" y="267" font-family="monospace" font-size="11" fill="#43413c">Cold miss + GitHub failure: maintained snapshot, HTTP 503, five-minute retry window.</text>
  <text x="52" y="290" font-family="monospace" font-size="11" fill="#43413c">Workers Caching hits still count as requests but skip Worker CPU; the adapter Cache API runs inside Worker.</text>
  <text x="52" y="311" font-family="monospace" font-size="11" fill="#43413c">Do not assume the adapter Cache API works on workers.dev; use Cf-Cache-Status to check deployed edge behavior.</text>
</svg>
