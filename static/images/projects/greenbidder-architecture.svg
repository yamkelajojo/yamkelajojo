<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="arch-gb-title">
  <title id="arch-gb-title">GreenBidder Geospatial Marketplace Relational and PostGIS Schema</title>
