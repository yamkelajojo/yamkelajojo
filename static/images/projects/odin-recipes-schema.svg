  <rect x="32" y="205" width="896" height="75" rx="6" fill="#efeae0" stroke="#dcd5c7"/>
  <text x="52" y="235" font-family="monospace" font-size="12" font-weight="700" fill="#161615">FULL-STACK ARCHITECTURE // PHP 8.2 + LARAVEL + SQLITE/MYSQL</text>
  <text x="52" y="258" font-family="monospace" font-size="12" fill="#43413c">Separates preparation stages from individual steps and links reusable ingredients to measurement units.</text>
