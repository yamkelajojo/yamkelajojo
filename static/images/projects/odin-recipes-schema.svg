    <text x="129" y="138" text-anchor="middle" fill="#625e57">1:N Category Hierarchy</text>
    <text x="129" y="156" text-anchor="middle" fill="#625e57">RecipeImage Gallery</text>

    <text x="247" y="128" text-anchor="middle" fill="#a83e1d" font-weight="700">→</text>

    <rect x="267" y="80" width="215" height="95" rx="6" fill="#dff0e8" stroke="#a8d8c2"/>
    <text x="374" y="115" text-anchor="middle" font-weight="700" fill="#114b36">RecipeIngredient Pivot</text>
    <text x="374" y="138" text-anchor="middle" fill="#114b36">Ingredient + Unit Models</text>
    <text x="374" y="156" text-anchor="middle" fill="#114b36">Normalized Quantities</text>

    <text x="502" y="128" text-anchor="middle" fill="#a83e1d" font-weight="700">→</text>

    <rect x="522" y="80" width="215" height="95" rx="6" fill="#e3ecf8" stroke="#b3c9e8"/>
    <text x="629" y="115" text-anchor="middle" font-weight="700" fill="#183f6e">PreparationStage</text>
    <text x="629" y="138" text-anchor="middle" fill="#183f6e">PreparationStageStep</text>
    <text x="629" y="156" text-anchor="middle" fill="#183f6e">Ordered Multi-Stage Flow</text>

    <text x="755" y="128" text-anchor="middle" fill="#a83e1d" font-weight="700">→</text>

    <rect x="772" y="80" width="156" height="95" rx="6" fill="#161615"/>
    <text x="850" y="115" text-anchor="middle" font-weight="700" fill="#f7f4ee">Inertia + Vue 3</text>
    <text x="850" y="138" text-anchor="middle" fill="#c7c2b9">Tailwind CSS UI</text>
    <text x="850" y="156" text-anchor="middle" fill="#c7c2b9">/recipes/fetch</text>
