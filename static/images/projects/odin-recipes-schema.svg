<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="arch-or-title">
  <title id="arch-or-title">Odin Recipes Normalized Eloquent Domain Model</title>
  <rect width="960" height="320" rx="8" fill="#fbf9f5" stroke="#dcd5c7"/>
  <text x="32" y="40" font-family="monospace" font-size="13" font-weight="700" fill="#a83e1d">DOMAIN MODEL BLUEPRINT // LARAVEL 12 + ELOQUENT ORM + INERTIA.JS + VUE 3</text>
  <g font-family="monospace" font-size="12" fill="#161615">
    <rect x="32" y="80" width="195" height="95" rx="6" fill="#ffffff" stroke="#b4ab9b"/>
